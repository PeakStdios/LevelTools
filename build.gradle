plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.0.0-beta13"
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://redempt.dev') }
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
}

dependencies {
    implementation 'com.github.Redempt:Crunch:2.0.3'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.19'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.19'

    compileOnly 'io.papermc.paper:paper-api:26.3.build.242-stable'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'me.clip:placeholderapi:2.12.2'
}

group = 'me.byteful.plugin'
version = '2.2.1'
description = 'LevelTools'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.compilerArgs += ["-parameters"] // Lamp needs parameter names
}

shadowJar {
    minimize {
        exclude(dependency('io.github.revxrsal:.*:.*'))
    }
    archiveBaseName.set("LevelTools")
    archiveClassifier.set("")

    relocate 'redempt.crunch', 'me.byteful.plugin.leveltools.libs.crunch'
    relocate 'revxrsal.commands', 'me.byteful.plugin.leveltools.libs.lamp'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build.dependsOn += shadowJar
