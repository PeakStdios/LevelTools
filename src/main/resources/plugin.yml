name: "LevelTools"
version: "${version}"
main: "me.byteful.plugin.leveltools.LevelToolsPlugin"
author: byteful
description: "A plugin that adds a leveling system to tools, swords, and bows. Paper only fork."
website: "https://github.com/byteful/LevelTools"
api-version: "26.3"
softdepend:
  - PlaceholderAPI
permissions:
  leveltools.admin:
    description: "Permission to use admin commands."
    default: op
  leveltools.enabled:
    description: "Permission to let a player level up a tool."
    default: true
  leveltools.formula.*:
    description: "Wildcard permission for configured XP formulas."
    default: false
